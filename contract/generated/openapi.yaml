openapi: 3.1.0
info:
  title: Calendar API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /meeting-types:
    get:
      operationId: listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMeetingType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
  /meeting-types/{meetingTypeId}/availability:
    get:
      operationId: getMeetingTypeAvailability
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeAvailability'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /meetings:
    get:
      operationId: listOwnerMeetings
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMeeting
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
components:
  schemas:
    AvailabilityDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    CreateMeetingRequest:
      type: object
      required:
        - meetingTypeId
        - start
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          type: integer
          format: int32
          minimum: 1
        start:
          type: string
          format: date-time
        guestName:
          type: string
          minLength: 1
          maxLength: 100
        guestEmail:
          type: string
          minLength: 3
          maxLength: 254
        guestAdditionalInfo:
          type: string
          maxLength: 500
    CreateMeetingTypeRequest:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        durationMinutes:
          $ref: '#/components/schemas/MeetingDuration'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Meeting:
      type: object
      required:
        - id
        - meetingType
        - start
        - end
        - guestName
        - guestEmail
      properties:
        id:
          type: integer
          format: int32
        meetingType:
          $ref: '#/components/schemas/MeetingTypeSummary'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        guestAdditionalInfo:
          type: string
    MeetingDuration:
      type: number
      enum:
        - 15
        - 30
        - 60
        - 120
    MeetingType:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    MeetingTypeAvailability:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityDay'
    MeetingTypeSummary:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        durationMinutes:
          type: integer
          format: int32
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
