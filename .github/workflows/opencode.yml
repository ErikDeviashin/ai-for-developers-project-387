name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      (github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')) ||
      (github.event_name != 'issues' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' ||
      startsWith(github.event.comment.body, '/oc ') ||
      github.event.comment.body == '/opencode' ||
      startsWith(github.event.comment.body, '/opencode ')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Check pull request origin
        id: origin
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`

            if (context.eventName === 'pull_request_review_comment') {
              return context.payload.pull_request.head.repo.full_name === repository
            }

            if (!context.payload.issue.pull_request) {
              return true
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })

            return pullRequest.head.repo.full_name === repository

      - name: Checkout repository
        if: steps.origin.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode
        if: steps.origin.outputs.result == 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.6 --no-modify-path

      - name: Run OpenCode on comment
        if: steps.origin.outputs.result == 'true' && github.event_name != 'issues'
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"external_directory":"deny"}}
          MODEL: opencode/deepseek-v4.1-flash
          AGENT: build
          MENTIONS: /opencode,/oc
          USE_GITHUB_TOKEN: 'false'

      - name: Run OpenCode auto-triage
        if: steps.origin.outputs.result == 'true' && github.event_name == 'issues'
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: |
            Triage the newly opened GitHub issue #${{ github.event.issue.number }} in this repository.

            First read the new issue and all of its comments. Then read AGENTS.md, docs/agents/issue-tracker.md,
            docs/agents/triage-labels.md, GLOSSARY.md, the relevant files in docs/adr/, and the existing
            application code needed to understand the request. If the issue already carries the
            ready-for-agent label, stop without triaging it.

            Then run the triage skill by following .agents/skills/triage/SKILL.md. Work asynchronously: do not
            wait for an interactive answer from the maintainer. Post a comment on the issue that starts with the
            AI disclaimer required by the skill and contains the triage analysis, a recommendation, and every
            missing question needed to move the issue forward. Ask specific, actionable questions.

            Use only the canonical triage labels defined in docs/agents/triage-labels.md: needs-triage,
            needs-info, ready-for-agent, ready-for-human, and wontfix. Apply at most one category label
            (bug or enhancement) and exactly one state label, unless an existing conflicting state needs a
            maintainer decision.

            Do not change any code, configuration, API contract, tests, or generated files. Do not implement
            the issue. Do not create commits, branches, or pull requests. Do not run the to-spec, to-tickets,
            or implement-spec skills automatically. Stop after triage.
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"external_directory":"deny"}}
          MODEL: opencode/deepseek-v4.1-flash
          AGENT: build
          MENTIONS: /opencode,/oc
          USE_GITHUB_TOKEN: 'false'
